<!doctype html>
<!-- Source of site/assets/og.png, the 1200x630 picture shown when the site's link is shared
     (Threads, LinkedIn, WhatsApp, ...). Figures are from the project's evaluation runs
     (site/data/patch-data.js). To change it, edit this file and re-render, e.g. with Playwright:
       page.setViewportSize({width: 1200, height: 630}); page.goto(file); page.screenshot({path: 'site/assets/og.png'}) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root { --bg: #0d1117; --panel: #151b23; --line: #29323d; --ink: #e5e9ef; --muted: #98a3b1; --ok: #4cc777; --rhel: #ff4d5e; --win: #47a3ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.5px) 0 0 / 24px 24px, var(--bg);
    color: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 26px "IBM Plex Mono", monospace; }
  .mark { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, var(--rhel) 50%, var(--win) 50%); }
  h1 { margin-top: 56px; font-size: 64px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
  .sub { margin-top: 18px; font-size: 26px; color: var(--muted); }
  .sub b { color: var(--ink); font-weight: 600; }
  .stats { margin-top: auto; display: flex; gap: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; min-width: 0; }
  .stat .v { font: 600 40px "IBM Plex Mono", monospace; letter-spacing: -.02em; }
  .stat .v.ok { color: var(--ok); }
  .stat .l { margin-top: 2px; font-size: 18px; color: var(--muted); }
  .foot { margin-top: 22px; display: flex; justify-content: space-between; font: 400 20px "IBM Plex Mono", monospace; color: var(--muted); }
  .foot b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="brand"><span class="mark"></span>serverless-patch</div>
  <h1>Centralized agentless<br>patch management</h1>
  <p class="sub"><b>RHEL 9 and Windows Server 2022</b> patched with no agent on any host</p>
  <div class="stats">
    <div class="stat"><div class="v ok">99.9%</div><div class="l">updates verified fixed</div></div>
    <div class="stat"><div class="v">20</div><div class="l">patch cycles</div></div>
    <div class="stat"><div class="v ok">5 / 5</div><div class="l">hosts fully patched</div></div>
  </div>
  <div class="foot"><span>Final Year Project, evaluation results</span><b>agentless.ikmaljohari.my</b></div>
</body>
</html>
